<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Mobile Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- jQuery & jQuery Mobile -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>

  <!-- Home Page -->
  <div data-role="page" id="home">
    <div data-role="header">
      <h1>Home</h1>
    </div>

    <div data-role="content">
      <p>Welcome to our simple mobile website using jQuery Mobile!</p>
      <a href="#about" data-role="button" data-transition="slide">Go to About</a>
      <a href="#contact" data-role="button" data-transition="flip">Go to Contact</a>
    </div>

    <div data-role="footer">
      <h4>&copy; 2026 My Mobile Site</h4>
    </div>
  </div>

  <!-- About Page -->
  <div data-role="page" id="about">
    <div data-role="header">
      <h1>About</h1>
    </div>

    <div data-role="content">
      <p>This is a demo mobile website created with jQuery Mobile framework.</p>
      <a href="#home" data-role="button" data-transition="slide">Back to Home</a>
    </div>

    <div data-role="footer">
      <h4>About Page Footer</h4>
    </div>
  </div>

  <!-- Contact Page -->
  <div data-role="page" id="contact">
    <div data-role="header">
      <h1>Contact</h1>
    </div>

    <div data-role="content">
      <form>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name">

        <label for="email">Email:</label>
        <input type="email" name="email" id="email">

        <input type="submit" value="Submit">
      </form>
      <a href="#home" data-role="button" data-transition="slide">Back to Home</a>
    </div>

    <div data-role="footer">
      <h4>Contact Page Footer</h4>
    </div>
  </div>

</body>
</html>

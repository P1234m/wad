<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding-top: 20px;
      position: fixed;
      width: 220px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .content {
      margin-left: 220px;
      padding: 20px;
    }
    .card {
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4 class="text-center">Dashboard</h4>
    <a href="#">Home</a>
    <a href="#">Users</a>
    <a href="#">Products</a>
    <a href="#">Exams</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </div>

  <!-- Content -->
  <div class="content">
    <h2 class="mb-4">Admin Statistics</h2>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card text-center shadow">
          <div class="card-body">
            <h5 class="card-title">Users</h5>
            <p class="card-text fs-4">1,250</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow">
          <div class="card-body">
            <h5 class="card-title">Orders</h5>
            <p class="card-text fs-4">320</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow">
          <div class="card-body">
            <h5 class="card-title">Revenue</h5>
            <p class="card-text fs-4">₹85,000</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow">
          <div class="card-body">
            <h5 class="card-title">Exams</h5>
            <p class="card-text fs-4">45</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
